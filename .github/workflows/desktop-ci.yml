name: desktop-ci

on:
  pull_request:
    paths: ["desktop/**", "web/powermap.*", "web/ua-map.json", ".github/workflows/desktop-*.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "web/powermap.*", "web/ua-map.json"]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
