name: data-tests

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/**", ".github/workflows/data*.yml"]
  pull_request:
    paths: ["data/**", ".github/workflows/data*.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -q
