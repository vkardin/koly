name: data dry run

# Runs the whole data pipeline against a copy of the published site, without publishing,
# so a change to the sources is checked on live data before it is merged.
on:
  pull_request:
    paths: ["data/**", ".github/workflows/data-dry-run.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements.txt
      - run: pip install -r data/requirements.txt
      - name: Copy of the published data
        run: |
          git fetch --depth 1 origin gh-pages
          mkdir site && git archive FETCH_HEAD v1 | tar -x -C site
      - name: Fetch schedules
        working-directory: data
        run: python run.py --site ../site --report ../report.json
      - name: Summary of source checks
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print("| region | status | updated | checks |\n|---|---|---|---|")
          for f in sorted(pathlib.Path("site/v1/regions").glob("*.json")):
              d = json.loads(f.read_text())
              checks = ", ".join(f"{c['source']}: {c['result']}" + (f" ({', '.join(x['date'] for x in c['days'])})" if c['days'] else "") for c in d.get("checks", []))
              print(f"| {d['id']} | {d['status']} | {d['updatedAt'][5:16]} | {checks or '—'} |")
          PY
      - name: Where sources disagree
        run: |
          python - <<'PY'
          import json, pathlib
          for f in sorted(pathlib.Path("site/v1/regions").glob("*.json")):
              d = json.loads(f.read_text())
              main = {x["date"]: x for x in d["days"]}
              for c in d.get("checks", []):
                  for day in c["days"]:
                      m = main.get(day["date"], {"groups": {}})
                      for g, iv in day["groups"].items():
                          a = " ".join(f"{i['from']}-{i['to']}{'?' if i['type'] == 'maybe' else ''}" for i in m["groups"].get(g, []))
                          b = " ".join(f"{i['from']}-{i['to']}{'?' if i['type'] == 'maybe' else ''}" for i in iv)
                          if a != b:
                              print(f"{d['id']} {day['date']} {g} | main({d['updatedAt'][11:16]}): {a or '-'} | {c['source']}({(c.get('updatedAt') or '')[11:16]}): {b or '-'}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            site/v1
            report.json
