name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. desktop-v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Check tag matches app version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$TAG" != "desktop-v$VERSION" ]; then
            echo "Tag $TAG does not match version $VERSION in tauri.conf.json" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Prepare release files
        run: |
          mkdir -p release
          SRC=$(ls src-tauri/target/release/bundle/nsis/*_"$VERSION"_x64-setup.exe)
          NAME="koly-widget-$VERSION-setup.exe"
          cp "$SRC" "release/$NAME"
          cp "$SRC.sig" "release/$NAME.sig"
          NOTES=$(awk -v v="$VERSION" '
            index($0, "## desktop " v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' ../CHANGELOG.md 2>/dev/null || true)
          node -e '
            const fs = require("fs");
            const [version, name, tag, notes] = process.argv.slice(1);
            fs.writeFileSync("release/latest.json", JSON.stringify({
              version,
              notes: notes.trim(),
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(`release/${name}.sig`, "utf8").trim(),
                  url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name}`,
                },
              },
            }, null, 2));
          ' "$VERSION" "$NAME" "$TAG" "$NOTES"
          printf '%s\n' "$NOTES" > release/notes.md
          ls -la release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Коли Є для Windows $VERSION" --notes-file release/notes.md --latest
          gh release upload "$TAG" release/koly-widget-*-setup.exe release/koly-widget-*-setup.exe.sig release/latest.json --clobber

      - name: Update the auto-update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest >/dev/null 2>&1 || \
            gh release create desktop-latest --prerelease --title "Windows update feed" \
              --notes "Service release used by the widget's auto-update. Download the app from the latest desktop-v* release."
          gh release upload desktop-latest release/latest.json --clobber
