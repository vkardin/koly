name: android-release

on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts || { echo "tag $version does not match versionName"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/koly.jks"
          echo "KOLY_KEYSTORE_FILE=$RUNNER_TEMP/koly.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          KOLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KOLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KOLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:model:test :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/koly-$VERSION-release.apk ../dist/koly-$VERSION.apk
          cp app/build/outputs/bundle/release/koly-$VERSION-release.aab ../dist/koly-$VERSION.aab
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ../dist/koly-$VERSION.apk ../dist/koly-$VERSION.aab \
            --title "Коли Є для Android $VERSION" \
            --notes "Android $VERSION. Details are in CHANGELOG.md."
