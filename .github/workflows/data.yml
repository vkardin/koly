name: data

on:
  schedule:
    # Off the top of the hour, when GitHub delays or drops scheduled runs most.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Check out published data
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add site FETCH_HEAD
            git -C site switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Fetch schedules
        working-directory: data
        run: python run.py --site ../site

      - name: Copy website
        run: cp -r web/. site/

      - name: Publish if changed
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "data: update schedules"
          git push origin gh-pages

      - name: Check data health
        working-directory: data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py --site ../site

      - name: Report failed run
        if: failure()
        working-directory: data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py --workflow-failed "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
